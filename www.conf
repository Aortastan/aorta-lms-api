[www]

user = www-data
group = www-data

listen = 0.0.0.0:9000

pm.process_idle_timeout = 10s
pm.max_requests = 500

pm = dynamic
pm.max_children = 20
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10

request_terminate_timeout = 30m
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
